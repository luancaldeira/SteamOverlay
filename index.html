<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <link rel="stylesheet" href="styles.css" />
    <title>Steam Spec Overlay</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="tb-left">
          <span class="tb-title">STEAM SPEC OVERLAY</span>
          <span id="mode" class="mode" title="modo de detecção">
            <span class="mode-dot"></span><span id="mode-text">…</span>
          </span>
        </div>
        <div class="tb-btns">
          <button id="btn-hide" class="tb-btn" title="Esconder (Ctrl+Shift+S)">–</button>
          <button id="btn-quit" class="tb-btn" title="Sair">×</button>
        </div>
      </header>

      <main id="body">
        <section id="game">
          <div id="game-name" class="game-name">—</div>
          <div id="game-sub" class="game-sub"></div>
        </section>

        <section id="toggle" class="toggle" hidden>
          <button data-req="recommended" class="seg active">RECOMENDADO</button>
          <button data-req="minimum" class="seg">MÍNIMO</button>
        </section>

        <section id="gauge-wrap">
          <svg id="gauge" viewBox="0 0 200 120" aria-hidden="true">
            <path class="gauge-track" d="M 20 110 A 80 80 0 0 1 180 110" pathLength="100" />
            <path id="gauge-value" class="gauge-value" d="M 20 110 A 80 80 0 0 1 180 110" pathLength="100" stroke-dasharray="0 100" />
            <line id="needle" x1="100" y1="110" x2="20" y2="110" class="needle" />
            <circle cx="100" cy="110" r="5" class="needle-hub" />
          </svg>
          <div class="gauge-center">
            <span id="gauge-num" class="gauge-num">--</span><span class="gauge-pct">%</span>
          </div>
          <div id="verdict" class="verdict"></div>
        </section>

        <section id="components">
          <div class="comp" data-c="gpu">
            <div class="comp-head"><span class="comp-label">GPU</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
          <div class="comp" data-c="cpu">
            <div class="comp-head"><span class="comp-label">CPU</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
          <div class="comp" data-c="ram">
            <div class="comp-head"><span class="comp-label">RAM</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
        </section>

        <section id="message" class="message" hidden></section>
      </main>

      <footer id="foot">
        <span class="foot-note">estimativa — não é medida exata</span>
        <button id="btn-retry" class="foot-btn" hidden>retry</button>
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>

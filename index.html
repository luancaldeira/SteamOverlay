<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <link rel="stylesheet" href="styles.css" />
    <title>Steam Spec Overlay</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="tb-left">
          <span class="tb-title">SPEC OVERLAY</span>
          <span id="mode" class="mode" title="modo de detecção">
            <span class="mode-dot"></span><span id="mode-text">…</span>
          </span>
        </div>
        <div class="tb-btns">
          <button id="btn-settings" class="tb-btn" title="Configurações">⚙</button>
          <button id="btn-hide" class="tb-btn" title="Esconder">–</button>
          <button id="btn-quit" class="tb-btn" title="Sair">×</button>
        </div>
      </header>

      <main id="body">
        <section id="art" class="art" hidden><img id="art-img" alt="" /></section>

        <section id="game">
          <div id="game-name" class="game-name">—</div>
          <div id="game-sub" class="game-sub"></div>
        </section>

        <section id="toggle" class="toggle" hidden>
          <button data-req="recommended" class="seg active">RECOMENDADO</button>
          <button data-req="minimum" class="seg">MÍNIMO</button>
        </section>

        <section id="gauge-wrap">
          <svg id="gauge" viewBox="0 0 200 120" aria-hidden="true">
            <path class="gauge-track" d="M 20 110 A 80 80 0 0 1 180 110" pathLength="100" />
            <path id="gauge-value" class="gauge-value" d="M 20 110 A 80 80 0 0 1 180 110" pathLength="100" stroke-dasharray="0 100" />
            <line id="needle" x1="100" y1="110" x2="20" y2="110" class="needle" />
            <circle cx="100" cy="110" r="5" class="needle-hub" />
          </svg>
          <div class="gauge-center">
            <span id="gauge-num" class="gauge-num">--</span><span class="gauge-pct">%</span>
          </div>
          <div id="verdict" class="verdict"></div>
        </section>

        <section id="components">
          <div class="comp" data-c="gpu">
            <div class="comp-head"><span class="comp-label">GPU</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
          <div class="comp" data-c="cpu">
            <div class="comp-head"><span class="comp-label">CPU</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
          <div class="comp" data-c="ram">
            <div class="comp-head"><span class="comp-label">RAM</span><span class="comp-score">--</span></div>
            <div class="bar"><div class="bar-fill"></div></div>
            <div class="comp-detail"></div>
          </div>
        </section>

        <section id="extras" class="extras" hidden></section>

        <section id="message" class="message" hidden></section>

        <section id="settings" class="settings" hidden>
          <h4>CONFIGURAÇÕES</h4>
          <label class="row">
            <span>Opacidade</span>
            <input id="set-opacity" type="range" min="35" max="100" step="5" />
            <output id="set-opacity-val">100%</output>
          </label>
          <label class="row check"><input id="set-ontop" type="checkbox" /><span>Sempre no topo</span></label>
          <label class="row check"><input id="set-click" type="checkbox" /><span>Click-through (ignora o mouse)</span></label>
          <label class="row check"><input id="set-compact" type="checkbox" /><span>Modo compacto</span></label>
          <label class="row check"><input id="set-art" type="checkbox" /><span>Mostrar arte do jogo</span></label>
          <label class="row check"><input id="set-autostart" type="checkbox" /><span>Iniciar com o Windows</span></label>
          <label class="row">
            <span>Abrir em</span>
            <select id="set-reqtype">
              <option value="recommended">Recomendado</option>
              <option value="minimum">Mínimo</option>
            </select>
          </label>
          <div class="set-actions">
            <button class="msg-btn ghost" data-act="data">Abrir pasta de dados</button>
            <button class="msg-btn" data-act="close">Fechar</button>
          </div>
          <div id="set-hint" class="set-hint"></div>
        </section>
      </main>

      <footer id="foot">
        <span class="foot-note">estimativa — não é medida exata</span>
        <span id="stale-badge" class="stale-badge" hidden title="sem rede: dados do cache">CACHE</span>
        <button id="btn-retry" class="foot-btn" hidden>retry</button>
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
